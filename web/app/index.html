<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#262624">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="N-Flow">
<link rel="manifest" href="/app/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<title>N-Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: ein Telefon-Bildschirm (max 420px), Kopfleiste oben, Untermenü unten, Assistent mit Schrittleiste */
:root{
  --bg:#e9edf1; --surface:#ffffff; --surface2:#f6f7f9; --line:#e4e7ec;
  --fg:#1f2633; --muted:#6b7385; --accent:#e9660f; --accent-ink:#ffffff; --accent-soft:#fff0e4;
  --ok:#23804a; --ok-soft:#e5f5eb; --warn:#a96500; --warn-soft:#fdf2df; --crit:#c0352b; --crit-soft:#fdeceb;
  --frame:#ffffff; --shadow:0 1px 2px rgba(31,38,51,.05),0 6px 18px -8px rgba(31,38,51,.12);
  --f-display:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Figtree",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11141a; --surface:#1b2029; --surface2:#151920; --line:#2a303b;
  --fg:#eef1f5; --muted:#9aa3b2; --accent:#ff7d2e; --accent-ink:#1a0c03; --accent-soft:#3a2516;
  --ok:#5cc583; --ok-soft:#173022; --warn:#e8a842; --warn-soft:#3a2c12; --crit:#ff7466; --crit-soft:#3d1c19; --frame:#1b2029; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11141a; --surface:#1b2029; --surface2:#151920; --line:#2a303b;
  --fg:#eef1f5; --muted:#9aa3b2; --accent:#ff7d2e; --accent-ink:#1a0c03; --accent-soft:#3a2516;
  --ok:#5cc583; --ok-soft:#173022; --warn:#e8a842; --warn-soft:#3a2c12; --crit:#ff7466; --crit-soft:#3d1c19; --frame:#1b2029; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.note{max-width:420px;align-items:center;width:100%;font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.phone{width:100%;max-width:420px;height:min(860px,calc(100vh - 64px));min-height:600px;background:var(--surface2);
  border:1px solid var(--line);border-radius:28px;overflow:hidden;display:flex;flex-direction:column;position:relative;
  box-shadow:0 20px 60px -30px rgba(0,0,0,.45)}
@media (max-width:460px){body{padding:0}.note{padding:8px 16px 0}.phone{border-radius:0;border:0;height:calc(100vh - 40px);max-width:none}}
/* Kopf */
.top{background:var(--frame);color:#f3f1ec;padding:14px 16px 12px;display:flex;align-items:center;gap:12px}
.top .back{background:none;border:0;color:#f3f1ec;font-size:22px;line-height:1;padding:4px 6px;margin-left:-6px}
.brand{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.06em}
.brand b{color:#ff7a24}
.top h1{font-family:var(--f-display);font-weight:600;font-size:20px;margin:0;letter-spacing:.02em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.net{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;background:#24262a;border:0;border-radius:99px;padding:5px 10px;color:#f3f1ec}
.net i{width:8px;height:8px;border-radius:50%;background:#5cc07a;display:block}
.net.off i{background:#e6a23c}
.main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.pad{padding:16px;display:flex;flex-direction:column;gap:14px}
/* Untermenü */
.tabs{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{background:none;border:0;padding:10px 4px 12px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--fg);font-weight:600}
.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;background:var(--accent);border-radius:0 0 3px 3px}
.badge{position:absolute;top:6px;right:calc(50% - 20px);background:var(--accent);color:var(--accent-ink);font-size:10px;font-weight:700;border-radius:99px;min-width:16px;height:16px;padding:0 4px;display:grid;place-items:center}
/* Bausteine */
.eyebrow{font-family:var(--f-display);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.day{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.day h2{font-family:var(--f-display);font-size:30px;margin:0;font-weight:700;line-height:1}
.greet h2{font-family:var(--f-display);font-size:32px;margin:0;font-weight:700;line-height:1.05;text-wrap:balance}
.greet p{margin:4px 0 0;color:var(--muted);font-size:14px}
h3.sub{font-family:var(--f-display);font-size:20px;margin:0;font-weight:600;letter-spacing:.02em}
.ico{background:none;border:0;color:#f3f1ec;padding:6px;margin-left:auto;display:grid;place-items:center}
.ico svg{width:22px;height:22px}
.ico+.net{margin-left:0}
.top .ico{margin-left:auto}
.top .ico~.ico{margin-left:0}
.top .net{margin-left:auto}
.top .ico~.net{margin-left:0}
.icotxt{width:auto;padding:0 12px;font-weight:700;font-size:14px;gap:4px;display:flex;align-items:center}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--accent);border-radius:12px;padding:4px 4px 4px 12px}
.search input{border:0;background:none;font-family:var(--f-mono);font-size:22px;padding:10px 0;min-width:0;flex:1}
.search input:focus{outline:none}
.search b{font-family:var(--f-mono);font-size:22px;color:var(--muted)}
.contact{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.contact:last-child{border-bottom:0}
.contact span{font-size:12px;color:var(--muted)}
.contact b{font-weight:600;font-size:15px}
.contact .tel{font-family:var(--f-mono);font-size:15px;user-select:all;grid-column:1}
.contact .acts{grid-row:1/4;grid-column:2;display:flex;flex-direction:column;gap:6px;justify-content:center}
.beleg{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.beleg:last-child{border-bottom:0}
.beleg .th{width:44px;height:44px;border-radius:8px;background:var(--surface2) center/cover;border:1px solid var(--line)}
.beleg p{margin:0;font-size:13px;color:var(--muted)}
.beleg b{font-size:15px}
.beleg .amt{font-family:var(--f-mono);font-weight:600;text-align:right}
.stamp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stamp button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600;font-size:14px}
.stamp button span{font-family:var(--f-mono);font-size:13px;font-weight:400;color:var(--muted)}
.stamp button.on{border-color:var(--accent);background:var(--accent-soft)}
.stamp button.on span{color:var(--accent)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.job{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-columns:52px 1fr;gap:12px;text-align:left;width:100%}
.job .t{font-family:var(--f-mono);font-size:14px;font-weight:600}
.job .t small{display:block;color:var(--muted);font-weight:400;font-size:11px}
.job h3{margin:0 0 2px;font-size:16px;font-weight:600}
.job p{margin:0;color:var(--muted);font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:12px;font-weight:600;border-radius:6px;padding:3px 8px;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.chip.or{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.wa{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.cr{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.jobrow{display:grid;grid-template-columns:1fr 64px;gap:8px}
.jobrow .job{min-width:0}
.maplink{border:1px solid var(--line);border-radius:14px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--fg);font-size:12px;font-weight:600;padding:8px 4px}
.mapimg{width:44px;height:44px;border-radius:10px;position:relative;overflow:hidden;
 background:linear-gradient(35deg,transparent 46%,var(--surface) 46%,var(--surface) 54%,transparent 54%),linear-gradient(-60deg,transparent 47%,var(--surface) 47%,var(--surface) 53%,transparent 53%),var(--ok-soft)}
.mapimg::after{content:"";position:absolute;left:50%;top:42%;width:14px;height:14px;background:var(--accent);border-radius:50% 50% 50% 0;transform:translate(-50%,-50%) rotate(-45deg);box-shadow:0 0 0 2px var(--surface)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal .h{font-size:11px;color:var(--muted);font-weight:600;padding:4px 0}
.cal button{border:0;background:none;border-radius:8px;padding:6px 0 4px;font-family:var(--f-mono);font-size:14px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:42px}
.cal button.out{color:var(--muted);opacity:.45}
.cal button.we{color:var(--muted)}
.cal button.today{outline:1.5px solid var(--accent);outline-offset:-1.5px}
.cal button.sel{background:var(--fg);color:var(--bg)}
.cal button.urlaub{background:var(--accent-soft)}
.cal button.sel.urlaub{background:var(--fg)}
.cal .dots{display:flex;gap:2px;height:5px}
.cal .dots i{width:5px;height:5px;border-radius:50%;background:var(--fg)}
.cal button.sel .dots i{background:var(--bg)}
.cal .dots i.b{background:var(--warn)}
.calhead{display:flex;align-items:center;justify-content:space-between}
.calhead button{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:34px;height:34px;font-size:18px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:block}
.agenda{display:flex;flex-direction:column}
.agenda div{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.agenda div:last-child{border-bottom:0}
.agenda time{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.btn{border:0;border-radius:12px;padding:14px 16px;font-weight:600;font-size:16px;background:var(--accent);color:var(--accent-ink);width:100%;display:flex;justify-content:center;align-items:center;gap:8px}
.btn.sec{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.btn.ghost{background:none;color:var(--muted);border:1px dashed var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.panel h4{margin:0;font-family:var(--f-display);font-size:16px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}
dl.kv dt{color:var(--muted)}
dl.kv dd{margin:0;font-weight:500;min-width:0;overflow-wrap:anywhere}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:500}
label.f.req>span::after{content:" *";color:var(--accent)}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;color:var(--fg)}
textarea{min-height:96px;resize:vertical}
input.num{font-family:var(--f-mono);text-align:right}
.unit{display:flex;align-items:center;gap:6px}
.unit em{font-style:normal;color:var(--muted);font-size:12px;min-width:44px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.check{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;font-size:15px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg.g2{display:grid;grid-template-columns:1fr 1fr}
.seg.wrap button{white-space:normal}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:9px 4px;font-size:14px;min-width:0;white-space:nowrap;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tb{display:flex;flex-wrap:wrap;gap:6px}
.tb button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 11px;font-size:13px}
/* Schrittleiste */
.steps{display:flex;gap:4px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto}
.steps button{flex:0 0 auto;border:0;background:none;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);min-width:46px}
.steps .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;border:1.5px solid var(--line);background:var(--surface2)}
.steps button.done .dot{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.steps button.cur{color:var(--fg);font-weight:600}
.steps button.cur .dot{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.foot{display:flex;gap:10px;padding:12px 16px;background:var(--surface);border-top:1px solid var(--line)}
.foot .btn{padding:13px}
/* Zeiten */
.clock{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.clock button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 10px;text-align:left;display:flex;flex-direction:column;gap:2px}
.clock button b{font-size:15px}
.clock button span{font-size:12px;color:var(--muted)}
.clock button.on{border-color:var(--accent);background:var(--accent-soft)}
.clock button.on span{color:var(--accent);font-family:var(--f-mono)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td,table.t th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
table.t th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
table.t td.r,table.t th.r{text-align:right}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sum div{background:var(--surface2);border-radius:10px;padding:8px 10px}
.sum b{display:block;font-family:var(--f-mono);font-size:18px}
.sum span{font-size:11px;color:var(--muted)}
/* Messung */
.result{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;border-radius:10px;background:var(--surface2)}
.result b{font-family:var(--f-mono);font-size:22px}
.result.ok{background:var(--ok-soft);color:var(--ok)}
.result.wa{background:var(--warn-soft);color:var(--warn)}
.result.cr{background:var(--crit-soft);color:var(--crit)}
.result small{display:block;font-size:12px;opacity:.9}
.hint{font-size:13px;color:var(--muted);margin:0}
.alert{border-radius:10px;padding:10px 12px;font-size:14px;background:var(--crit-soft);color:var(--crit)}
.alert.wa{background:var(--warn-soft);color:var(--warn)}
/* Unterschrift */
.sig{position:relative;background:var(--surface2);border:1px dashed var(--line);border-radius:12px;height:130px;touch-action:none}
.sig canvas{width:100%;height:100%;display:block;border-radius:12px}
.sig .ph{position:absolute;inset:auto 12px 10px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:4px;pointer-events:none}
.sig .clr{position:absolute;top:6px;right:6px;border:0;background:var(--surface);border-radius:8px;font-size:12px;padding:4px 8px;color:var(--muted)}
/* Scanner */
.scan{background:#0b0b0c;border-radius:16px;aspect-ratio:1/1;max-width:100%;position:relative;display:grid;place-items:center;overflow:hidden}
.scan .frame{width:62%;aspect-ratio:1/1;border-radius:14px;position:relative}
.scan .frame::before,.scan .frame::after{content:"";position:absolute;inset:0;border:3px solid #ff7a24;border-radius:14px;clip-path:polygon(0 0,28% 0,28% 6%,6% 6%,6% 28%,0 28%,0 72%,6% 72%,6% 94%,28% 94%,28% 100%,72% 100%,72% 94%,94% 94%,94% 72%,100% 72%,100% 28%,94% 28%,94% 6%,72% 6%,72% 0,100% 0,100% 100%,0 100%)}
.scan .laser{position:absolute;left:19%;right:19%;height:2px;background:#ff7a24;box-shadow:0 0 12px #ff7a24;top:30%;animation:sweep 2.2s ease-in-out infinite alternate}
@keyframes sweep{to{top:70%}}
@media (prefers-reduced-motion:reduce){.scan .laser{animation:none;top:50%}}
/* Betrieb: ganzer Bildschirm statt Telefon-Rahmen */
html,body{margin:0}
body{padding:0}
.wrap{display:block}
.phone,.phone.desk{max-width:none!important;height:100vh!important;height:100dvh!important;min-height:0!important;border:0!important;border-radius:0!important;box-shadow:none!important}
.scan video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scan{overflow:hidden}
.lade{display:grid;place-items:center;height:100%;color:var(--muted);padding:24px;text-align:center}
.alsbar{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.alsbar select{flex:1;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.fotos{display:flex;gap:6px;flex-wrap:wrap}.fotos img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.scan p{position:absolute;bottom:12px;left:0;right:0;text-align:center;color:#c9c6bf;font-size:13px;margin:0}
.sticker{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;width:100%}
.sticker .qr{width:44px;height:44px;flex:0 0 44px;border-radius:6px;background:var(--fg);-webkit-mask:var(--qr) center/cover;mask:var(--qr) center/cover}
.sticker b{display:block;font-family:var(--f-mono);font-size:14px}
.sticker span{font-size:13px;color:var(--muted)}
/* Anlage */
.hero{background:var(--frame);color:#f3f1ec;padding:4px 16px 18px;display:flex;flex-direction:column;gap:6px}
.hero .nv{font-family:var(--f-mono);color:#ff7a24;font-size:13px}
.hero h2{font-family:var(--f-display);font-size:26px;margin:0;line-height:1.05;font-weight:700;text-wrap:balance}
.hero p{margin:0;color:#b9b6ae;font-size:14px}
.hist{display:flex;flex-direction:column;gap:0}
.hist div{display:grid;grid-template-columns:86px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.hist div:last-child{border-bottom:0}
.hist time{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.hist b{font-weight:600}
/* Ergebnis */
.sync{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin-left:10px}
.sync div{position:relative;padding:0 0 14px 20px;font-size:14px}
.sync div::before{content:"";position:absolute;left:-7px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--surface2);border:2px solid var(--line)}
.sync div.ok::before{background:var(--ok);border-color:var(--ok)}
.sync div.wait::before{background:var(--warn);border-color:var(--warn)}

async function scanStart(){scanStopp();const v=$("#scanV"),pEl=$("#scanP");if(!v)return;
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){pEl.textContent="Kamera hier nicht verfügbar. Bitte die Kamera-App des Handys nutzen.";return}
 try{scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false})}catch(e){pEl.textContent="Kein Zugriff auf die Kamera. Bitte erlauben oder die Kamera-App nutzen.";return}
 if(S.view!=="scan"){scanStopp();return}
 v.srcObject=scanStream;await v.play().catch(()=>{});pEl.textContent="QR-Aufkleber in den Rahmen halten";scanLauf=true;
 let det=null;if("BarcodeDetector" in window){try{det=new BarcodeDetector({formats:["qr_code"]})}catch(e){}}
 if(!det&&!window.jsQR)await new Promise(ok=>{const s=document.createElement("script");s.src="/vendor/jsQR.js";s.onload=ok;s.onerror=ok;document.head.appendChild(s)});
 const c=document.createElement("canvas"),ctx=c.getContext("2d",{willReadFrequently:true});
 const schritt=async()=>{if(!scanLauf||S.view!=="scan")return scanStopp();
  try{let text=null;
   if(det){const r=await det.detect(v);if(r[0])text=r[0].rawValue}
   else if(window.jsQR&&v.videoWidth){const w=Math.min(640,v.videoWidth),h=Math.round(v.videoHeight*w/v.videoWidth);c.width=w;c.height=h;ctx.drawImage(v,0,0,w,h);const r=jsQR(ctx.getImageData(0,0,w,h).data,w,h,{inversionAttempts:"dontInvert"});if(r)text=r.data}
   if(text){scanStopp();if(navigator.vibrate)navigator.vibrate(60);kennungOeffnen(text);return}}catch(e){}
  setTimeout(schritt,250)};
 schritt()}

function stepOk(i){const r=R();switch(STEPS[i][0]){
 case"auftrag":return!!r.einsatzart;
 case"zeiten":return arbH(r)>0&&n(r.fz)!=null;
 case"befund":return r.diagnose.trim().length>3&&r.arbeiten.trim().length>3;
 case"messung":{const m=mig(r);return m.ver.rows.some(x=>n(x.o2)!=null&&n(x.ta)!=null)}
 case"material":return true;
 case"fest":return!!r.zustand;
 case"abschluss":return(r.nichtVorOrt||(r.papier&&r.papScan)||(r.sigK&&r.sigName.trim()));
}}

const MT={
 heiz:{label:"Heizgerät",cols:[["pkt","Messpunkt",""],["last","Last","%"],["durch","Durchsatz","m³/h"],["gfd","Gasfließ\u00addruck","mbar"],["o2","O₂","Vol.-%"],["co2","CO₂","Vol.-%"],["co","CO unverd.","ppm"],["nox","NOx","ppm"],["ta","Abgas\u00adtemp.","°C"],["tl","Verbr.-luft\u00adtemp.","°C"],["qa","Abgas\u00adverlust","%"],["vl","VL-Temp.","°C"],["rl","RL-Temp.","°C"]],rows:2,

 boel:{label:"Brenner Öl",cols:[["azl","AZL-Punkt",""],["lpos","Lastpos.","%"],["lk","Luftklappe","°"],["bs","Brennstoff","°"],["durch","Durchsatz","l/h"],["bl","Brenner\u00adleistung","kW"],["ovl","Öldruck Vorlauf","bar"],["orl","Öldruck Rücklauf","bar"],["o2","O₂ trocken","Vol.-%"],["co","CO","ppm"],["nox","NOx","ppm"],["ta","Abgas\u00adtemp.","°C"],["qa","Abgas\u00adverlust","%"],["russ","Rußzahl","-"],["pfr","p Feuerraum","mbar"]],rows:12}};

const MPICK=[["Ansaugtemperatur","°C"],["Zugbedarf","Pa"],["Feuerraumdruck","mbar"],["Druck vor Luftklappe","mbar"],["Gasruhedruck","mbar"],["Gasanschlussdruck","mbar"],["Düsendruck","mbar"],["Öldruck Vorlauf","bar"],["Öldruck Rücklauf","bar"],["Öl-Unterdruck","bar"],["Öldurchsatz","kg/h"],["Ionisationsstrom","µA"],["Flammensignal","%"],["Drehzahl Gebläse","U/min"],["Stellgröße Gasventil","%"],["Frequenzumformer","%"],["O2 feucht","Vol.-%"],["Luftzahl Lambda","-"],["CO bezogen","mg/m³"],["NOx bezogen","mg/m³"],["Rußzahl","-"],["Ölderivate","ja/nein"],["Kesseltemperatur","°C"],["Vorlauftemperatur","°C"],["Rücklauftemperatur","°C"],["Wärmeleistung","kW"],["Sicherheitszeit","s"],["Abgasdruck / Zug","Pa"],["Taupunkt Abgas","°C"],["Gasmenge Zähler","m³"],["Abgasanlage dicht","ja/nein"]];

const BPKT=["P0","P1","P2","P3","P4","P5","P6","P7","P8","P9","Bu","Bo"],HPKT=["Q min","Q max"];
function typFor(a){return a.energie==="Öl"?"boel":(a.details&&a.details.Brenner)?"bgas":"heiz"}
function blankRows(typ,k){return typ==="heiz"?HPKT.map(x=>({pkt:x})):BPKT.map(x=>({azl:x}))}
function newMess(a){const typ=typFor(a),R0=MT[typ].rows;return{typ,ang:{rows:blankRows(typ,R0),hide:[],extra:[],ub:{}},ver:{rows:blankRows(typ,R0),hide:[],extra:[],ub:{}},
 dicht:{p:"150",abfall:"",zeit:"5"},oel:{laenge:"",system:"",saug:""},betr:{starts:"",std:"",zaehler:"",weise:""},bem:"",pick:null}}
function mig(r){const a=ANLAGEN[r.q];if(!r.mess||!r.mess.typ)r.mess=newMess(a);const t=typFor(a);if(r.mess.typ!==t){r.mess.typ=t;["ang","ver"].forEach(sd=>{r.mess[sd].hide=[];const rw=r.mess[sd].rows;if(t!=="heiz"){while(rw.length<12)rw.push({});rw.forEach((x,i)=>{if(!x.azl&&BPKT[i])x.azl=BPKT[i]})}else rw.forEach((x,i)=>{if(!x.pkt&&HPKT[i])x.pkt=HPKT[i]})})}return r.mess}

 const m=r.mess,sd=m[side],T=MT[m.typ],cols=mCols(m,side),n=sd.rows.length;

const hm=m=>m==null?"–":String(Math.floor(m/60))+":"+String(Math.round(m%60)).padStart(2,"0");
const mins=t=>{if(!t)return null;const[a,b]=t.split(":").map(Number);return a*60+b};
function tagMin(d){if(!d||!d.kommen)return null;const g=mins(d.gehen||nowT())-mins(d.kommen);return Math.max(0,g-(d.pause||0))}

 for(let i=0;i<5;i++){const x=new Date(mo);x.setDate(mo.getDate()+i);const k=iso8(x);woche.push([x.toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit"}),S.arbeit[k],k])}
 const sum=woche.reduce((s,w)=>s+(tagMin(w[1])||0),0);

  </div>
  <div class="result ${d.kommen?"ok":""}"><div>Arbeitszeit heute<small>${d.kommen?(d.gehen?"abgeschlossen":"läuft, Pause wird abgezogen"):"noch nicht gestartet"}</small></div><b>${hm(tagMin(d))}</b></div>

 <div class="panel">
  <div class="calhead"><button type="button" data-zw="-1" aria-label="Vorwoche">‹</button><h4>${off===0?"Diese Woche":off===-1?"Letzte Woche":"KW "+kw(mo)}</h4><button type="button" data-zw="1" aria-label="Nächste Woche" ${off>=0?"disabled":""}>›</button></div>

 <div class="panel" id="nachPanel"><h4>Zeit nachtragen</h4>

function iso8(x){return iso(x)}
function kw(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const dn=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-dn);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7)}
function inUrlaub(k){return S.urlaub.find(u=>u.vonIso&&k>=u.vonIso&&k<=u.bisIso)}
function ichKal(){
 const now=new Date(),m=S.calM?new Date(S.calM+"-01T12:00"):new Date(now.getFullYear(),now.getMonth(),1,12);
 const first=new Date(m.getFullYear(),m.getMonth(),1,12),start=new Date(first);start.setDate(1-((first.getDay()+6)%7));
 const td=iso(now),sel=S.calSel||td;let cells="";
 for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=iso(d);
  const jobs=(k===td?JOBS.length:0)+PLAN.filter(p=>p.iso===k).length,bl=S.blocks.some(b=>b.iso===k),ur=inUrlaub(k);
  if(i>=35&&d.getMonth()!==m.getMonth())break;

 const items=[...(sel===td?JOBS.map(j=>({zeit:j.zeit,q:j.q,art:j.art})):[]),...PLAN.filter(p=>p.iso===sel)].sort((a,b)=>a.zeit.localeCompare(b.zeit));

 return`<div class="panel">

 <div class="panel"><h4>Als Nächstes geplant</h4><div class="agenda">${next.map(p=>{const a=ANLAGEN[p.q];return`<div><time>${new Date(p.iso+"T12:00").toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit"})}<br>${p.zeit}</time><span><b>${p.art}</b> · ${a.nv}<br>${esc(a.kunde.ort)}</span></div>`}).join("")}</div></div>`;
}

/* Dokumente öffnen: einmal geladen, danach auch ohne Netz */
const DOK_CACHE="nflow-dok";
function dokListe(){try{return JSON.parse(localStorage.getItem("nflow:dok")||"{}")}catch(e){return{}}}
function dokOffline(url){return !!dokListe()[url]}
async function dokMerken(url,antwort){try{const c=await caches.open(DOK_CACHE);await c.put(url,antwort);const l=dokListe();l[url]=Date.now();
 const alt=Object.entries(l).sort((a,b)=>b[1]-a[1]).slice(80);for(const [u] of alt){delete l[u];c.delete(u)}localStorage.setItem("nflow:dok",JSON.stringify(l))}catch(e){}}
async function dokHolen(url){
 try{const r=await fetch(url,{credentials:"same-origin"});if(r.ok){dokMerken(url,r.clone());return await r.blob()}const j=await r.json().catch(()=>({}));throw new Error(j.fehler||"Datei nicht verfügbar")}
 catch(e){try{const c=await caches.open(DOK_CACHE),m=await c.match(url);if(m)return await m.blob()}catch(x){}throw new Error(navigator.onLine?e.message:"Ohne Netz gehen nur Dateien, die schon einmal geöffnet oder vorgeladen wurden.")}}
let DOKV=null;
async function dokOeffnen(url,name){toast("Wird geladen …");try{const b=await dokHolen(url);if(DOKV)URL.revokeObjectURL(DOKV.url);DOKV={url:URL.createObjectURL(b),name:name||"Dokument",typ:b.type,blob:b};zeigeDok()}catch(e){toast(e.message)}}
function zeigeDok(){let L=$("#dokv");if(!L){L=document.createElement("div");L.id="dokv";document.body.appendChild(L)}
 if(!DOKV){L.innerHTML="";return}
 L.innerHTML=`<div class="dokv" role="dialog" aria-label="${esc(DOKV.name)}"><header><b>${esc(DOKV.name)}</b><button type="button" class="btn sec" data-dokteilen="1">Öffnen / Teilen</button><button type="button" class="ico" data-dokzu="1" aria-label="Schließen">✕</button></header>
  <div class="dokb">${/^image\//.test(DOKV.typ)?`<img src="${DOKV.url}" alt="${esc(DOKV.name)}">`:`<iframe src="${DOKV.url}" title="${esc(DOKV.name)}"></iframe>`}</div></div>`}
async function dokTeilen(){if(!DOKV)return;const f=new File([DOKV.blob],DOKV.name.replace(/[\\/:*?"<>|]/g,"-")+(/\.[a-z0-9]{2,4}$/i.test(DOKV.name)?"":DOKV.typ==="application/pdf"?".pdf":".jpg"),{type:DOKV.typ});
 try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:DOKV.name});return}}catch(e){if(e.name==="AbortError")return}
 window.open(DOKV.url,"_blank")}

function poolStat(p){const pl=poolPlan(p),t=Math.round((new Date(p.due+"T12:00")-new Date(iso(new Date())+"T12:00"))/864e5);
 if(p.done)return{k:"done",c:"ok",l:"erledigt "+fmt(p.done+"T12:00")};
 if(pl)return{k:"plan",c:"bl",l:"Termin "+new Date(pl.date+"T12:00").toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit"})+" "+pl.time};
 if(t<0)return{k:"over",c:"cr",l:`überfällig seit ${-t} Tagen`,t};
 if(t<=60)return{k:"due",c:"wa",l:`fällig in ${t} Tagen`,t};
 return{k:"later",c:"",l:`fällig ${fmt(p.due+"T12:00")}`,t}}
function poolCard(){const st=POOL.map(poolStat),ue=st.filter(x=>x.k==="over").length,f=st.filter(x=>x.k==="due").length,ok=st.filter(x=>x.k==="done"||x.k==="plan").length;

function b64zuBytes(b){const p="=".repeat((4-b.length%4)%4),s=atob((b+p).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from([...s].map(c=>c.charCodeAt(0)))}
async function pushAnmelden(){
 try{const ok=await Notification.requestPermission();if(ok!=="granted"){toast("Mitteilungen wurden nicht erlaubt");render();return}
  const reg=await navigator.serviceWorker.ready,{schluessel}=await NF.api("/api/push/schluessel");
  const abo=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64zuBytes(schluessel)});
  await NF.api("/api/push/abo",{method:"POST",body:{abo:abo.toJSON(),geraet:navigator.userAgent.slice(0,120),fuer:S.alsTech||null}});
  S.pushAn=true;save();render();toast("Mitteilungen sind an")}
 catch(e){toast("Mitteilungen konnten nicht eingerichtet werden: "+e.message)}}
async function pushAbmelden(){try{const reg=await navigator.serviceWorker.ready,abo=await reg.pushManager.getSubscription();if(abo){await NF.api("/api/push/abo",{method:"DELETE",body:{endpoint:abo.endpoint}});await abo.unsubscribe()}S.pushAn=false;save();render();toast("Mitteilungen auf diesem Handy aus")}catch(e){toast(e.message)}}
async function pushPruefen(){if(!pushMoeglich()||Notification.permission!=="granted")return;try{const reg=await navigator.serviceWorker.ready,abo=await reg.pushManager.getSubscription();
 if(abo){S.pushAn=true;NF.api("/api/push/abo",{method:"POST",body:{abo:abo.toJSON(),geraet:navigator.userAgent.slice(0,120),fuer:S.alsTech||null}}).catch(()=>{})}else if(S.pushAn){S.pushAn=false;save()}}catch(e){}}
function wartPruefen(){if(S.wartAktiv&&S.pushSeen!==iso(new Date()))setTimeout(showPush,800)}

})();
