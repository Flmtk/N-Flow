<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>N-Flow Büro</title>
<link rel="icon" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Caveat:wght@500&display=swap">
<style>
/* Layout: Seitenleiste links, Arbeitsfläche rechts; Plantafel = Raster Monteur × Wochentag mit Einplanen-Spalte */
:root{
  --bg:#e9edf1; --surface:#ffffff; --surface2:#f6f7f9; --line:#e4e7ec;
  --fg:#1f2633; --muted:#6b7385; --accent:#e9660f; --accent-ink:#ffffff; --accent-soft:#fff0e4;
  --ok:#23804a; --ok-soft:#e5f5eb; --warn:#a96500; --warn-soft:#fdf2df; --crit:#c0352b; --crit-soft:#fdeceb;
  --t1:#e9660f; --t2:#2f6fd6; --t2-soft:#e7effc; --t3:#7a4fd0; --t3-soft:#efe9fb; --t4:#0f8a7e; --t4-soft:#e1f4f1; --t5:#c2417a; --t5-soft:#fbe8f0; --t6:#5b6b2e; --t6-soft:#eef1e2; --hatch:#eef0f3;
  --shadow:0 1px 2px rgba(31,38,51,.05),0 6px 18px -8px rgba(31,38,51,.12);
  --f:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11141a; --surface:#1b2029; --surface2:#151920; --line:#2a303b;
  --fg:#eef1f5; --muted:#9aa3b2; --accent:#ff7d2e; --accent-ink:#1a0c03; --accent-soft:#3a2516;
  --ok:#5cc583; --ok-soft:#173022; --warn:#e8a842; --warn-soft:#3a2c12; --crit:#ff7466; --crit-soft:#3d1c19;
  --t1:#ff7d2e; --t2:#6ea0ff; --t2-soft:#1a2740; --t3:#a88bf0; --t3-soft:#2a2140; --t4:#4fc6b8; --t4-soft:#153430; --t5:#f07aa8; --t5-soft:#3a1a28; --t6:#a9bf6a; --t6-soft:#283018; --hatch:#20252f; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11141a; --surface:#1b2029; --surface2:#151920; --line:#2a303b;
  --fg:#eef1f5; --muted:#9aa3b2; --accent:#ff7d2e; --accent-ink:#1a0c03; --accent-soft:#3a2516;
  --ok:#5cc583; --ok-soft:#173022; --warn:#e8a842; --warn-soft:#3a2c12; --crit:#ff7466; --crit-soft:#3d1c19;
  --t1:#ff7d2e; --t2:#6ea0ff; --t2-soft:#1a2740; --t3:#a88bf0; --t3-soft:#2a2140; --t4:#4fc6b8; --t4-soft:#153430; --t5:#f07aa8; --t5-soft:#3a1a28; --t6:#a9bf6a; --t6-soft:#283018; --hatch:#20252f; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:15px;line-height:1.4;font-variant-numeric:tabular-nums;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note{max-width:1440px;margin:0 auto 10px;font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.chipbtn{border:0;border-radius:99px;background:var(--surface);color:var(--muted);font-weight:600;font-size:12px;padding:4px 10px;box-shadow:var(--shadow)}
.app{max-width:1440px;margin:0 auto;height:calc(100vh - 62px);min-height:640px;background:var(--surface2);border-radius:20px;overflow:hidden;
  display:grid;grid-template-columns:232px minmax(0,1fr);box-shadow:0 30px 70px -40px rgba(31,38,51,.45)}
/* Seitenleiste */
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px;gap:4px;min-height:0}
.brand{display:flex;align-items:center;justify-content:space-between;padding:0 12px 4px}
.brand span{font-weight:800;font-size:21px;letter-spacing:-.01em}
.brand b{color:var(--accent)}
.role{font-size:12px;color:var(--muted);padding:0 12px 14px}
.nav{display:flex;align-items:center;gap:10px;border:0;background:none;padding:10px 12px;border-radius:12px;color:var(--muted);font-size:15px;text-align:left;width:100%}
.nav svg{width:21px;height:21px;flex:0 0 21px}
.nav[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.nav .cnt{margin-left:auto;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;border-radius:99px;min-width:20px;height:20px;padding:0 6px;display:grid;place-items:center}
.nav .cnt.soft{background:var(--surface2);color:var(--muted)}
.side .foot{margin-top:auto;font-size:12px;color:var(--muted);padding:12px}
/* Hauptbereich */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:12px;padding:16px 28px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.top h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em;margin-right:auto}
.view{flex:1;overflow:auto;min-height:0}
.pad{padding:24px 28px;display:flex;flex-direction:column;gap:18px;max-width:1200px}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;font-size:14px;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.sec{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.btn.ghost{background:var(--surface2);color:var(--fg)}
.btn.ok{background:var(--ok);color:#fff}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.ico{border:0;background:var(--surface2);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;color:var(--fg)}
.ico svg{width:19px;height:19px}
.panel{background:var(--surface);border-radius:18px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h3{margin:0;font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.panel h3 .hint{font-weight:500;margin-left:auto}
.hint{font-size:13px;color:var(--muted);margin:0}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:99px;padding:3px 10px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.or{background:var(--accent-soft);color:var(--accent)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.wa{background:var(--warn-soft);color:var(--warn)}
.chip.cr{background:var(--crit-soft);color:var(--crit)}
.chip.bl{background:var(--t2-soft);color:var(--t2)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.kpi{background:var(--surface);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);border:0;text-align:left;display:flex;flex-direction:column;gap:2px}
.kpi b{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.kpi span{font-size:13px;color:var(--muted)}
.kpi.alert b{color:var(--crit)}
.greet h2{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em}
.greet p{margin:2px 0 0;color:var(--muted)}
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.li:last-child{border-bottom:0}
.li b{font-weight:600}
.li small{display:block;color:var(--muted);font-size:13px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted)}
.dot.cr{background:var(--crit)}.dot.wa{background:var(--warn)}.dot.or{background:var(--accent)}.dot.ok{background:var(--ok)}.dot.bl{background:var(--t2)}
table.tb{width:100%;border-collapse:collapse;font-size:14px}
table.tb th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.tb td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.tb tr:last-child td{border-bottom:0}
table.tb tr.click{cursor:pointer}
table.tb tr.click:hover td{background:var(--surface2)}
.tbwrap{overflow-x:auto}
.seg{display:inline-flex;background:var(--surface2);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:9px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{width:100%;background:var(--surface2);border:1px solid transparent;border-radius:10px;padding:9px 11px;font-size:15px;color:var(--fg)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);background:var(--surface)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:12px;padding:0 12px;box-shadow:var(--shadow);min-width:260px}
.search input{border:0;background:none;padding:9px 0}
.search svg{width:17px;height:17px;color:var(--muted)}
/* Plantafel */
.board{display:grid;grid-template-columns:264px minmax(0,1fr);height:100%;min-height:0}
.pool{border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.pool header{padding:16px 16px 10px;display:flex;flex-direction:column;gap:10px}
.pool header h3{margin:0;font-size:16px;display:flex;align-items:center;gap:8px}
.pool .items{overflow:auto;padding:4px 12px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.pool.drop{background:var(--accent-soft)}
.pool .seg{display:flex;flex-wrap:wrap}
.pool .seg button{flex:1 1 auto;padding:6px 8px}
.card{background:var(--surface);border-radius:12px;padding:9px 10px 9px 12px;box-shadow:var(--shadow);border:0;text-align:left;width:100%;position:relative;display:flex;flex-direction:column;gap:2px;cursor:grab;font-size:13px}
.card::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--muted)}
.card.Wartung::before{background:var(--ok)}
.card.Störung::before{background:var(--crit)}
.card.Reparatur::before,.card.Folgeauftrag::before{background:var(--warn)}
.card.Inbetriebnahme::before{background:var(--t2)}
.card.Umbau::before{background:var(--t4)}
.card.Sonstiges::before{background:var(--t3)}
.card.Intern::before{background:var(--muted)}
.card .lt{font-size:12px;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card b{font-size:13px;font-weight:700}
.card .r1{display:flex;gap:6px;align-items:center;justify-content:space-between}
.card .r1r{display:flex;gap:4px;align-items:center}
.ihint{width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;font:italic 600 13px/1 var(--f-serif,Georgia),serif;color:var(--muted);background:var(--surface2);border:1px solid var(--line);flex:0 0 auto;cursor:pointer}
.ihint.an{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.card .ihint:not(.an){opacity:0;width:0;margin-left:-4px;border-width:0;overflow:hidden;transition:opacity .15s}.card:hover .ihint:not(.an),.card:focus-visible .ihint:not(.an){opacity:1;width:20px;margin-left:0;border-width:1px}
.hwbox .hw{display:flex;flex-direction:column;gap:4px;padding:10px 0;border-top:1px solid var(--line)}
.hwbox .hw p{margin:0;line-height:1.5}
.hwbox .hw.erl p{color:var(--muted);text-decoration:line-through}
.hwbox .hw .btn{align-self:flex-start}
.hwbox>b{display:flex;align-items:center;gap:8px}
.card .meta{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card.sel{outline:2px solid var(--accent)}
.card.done{opacity:.55;cursor:default}
.card.pool-card{background:var(--surface2);box-shadow:none}
.card[draggable="true"]:active{cursor:grabbing}
.plan{display:flex;flex-direction:column;min-height:0;min-width:0}
.plan .bar{display:flex;align-items:center;gap:10px;padding:14px 20px;flex-wrap:wrap}
.plan .bar h3{margin:0 auto 0 0;font-size:16px}
.gridwrap{overflow:auto;flex:1;padding:0 16px 20px}
.pgrid{display:grid;grid-template-columns:118px repeat(5,minmax(128px,1fr));gap:8px;min-width:780px}
.ph{padding:6px 8px;font-size:13px;font-weight:700;color:var(--muted);display:flex;justify-content:space-between;align-items:baseline}
.ph.today{color:var(--accent)}
.ph small{font-weight:500}
.tech{background:var(--surface);border-radius:14px;padding:10px;font-size:13px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.tech .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px}
.tech b{font-size:14px}
.cell{background:var(--surface);border-radius:14px;padding:8px;min-height:150px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);position:relative}
.cell.today{box-shadow:0 0 0 2px var(--accent) inset,var(--shadow)}
.cell.drop{background:var(--accent-soft)}
.cell.target{cursor:copy;box-shadow:0 0 0 2px dashed var(--accent)}
.cell.away{background:repeating-linear-gradient(-45deg,var(--hatch),var(--hatch) 8px,var(--surface) 8px,var(--surface) 16px)}
.cell .cap{margin-top:auto;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.cell .cap i{flex:1;height:4px;border-radius:4px;background:var(--surface2);overflow:hidden;position:relative}
.cell .cap i::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--w);background:var(--ok);border-radius:4px}
.cell .cap.over i::after{background:var(--crit)}
.cell .cap.full i::after{background:var(--warn)}
.absence{font-size:12px;font-weight:700;border-radius:8px;padding:5px 8px;background:var(--surface2);color:var(--muted)}
.absence.u{background:var(--accent-soft);color:var(--accent)}
.absence.b{background:var(--warn-soft);color:var(--warn)}
.absence.p{border:1.5px dashed var(--warn);background:none;color:var(--warn)}
/* Seitenpanel (Detail) */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);box-shadow:-20px 0 60px -20px rgba(0,0,0,.35);z-index:20;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer header{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.drawer header h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.01em}
.drawer header p{margin:2px 0 0;color:var(--muted);font-size:13px}
.drawer .body{overflow:auto;padding:18px 20px;display:flex;flex-direction:column;gap:14px;flex:1}
.drawer footer{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.scrim{position:fixed;inset:0;background:rgba(15,20,30,.25);z-index:19}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}
dl.kv dt{color:var(--muted)}
dl.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{background:var(--surface2);border-radius:12px;padding:12px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.alert{border-radius:10px;padding:9px 12px;font-size:13px;background:var(--warn-soft);color:var(--warn)}
.alert.cr{background:var(--crit-soft);color:var(--crit)}
.inv{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.invh{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center}
.invh small{display:block;color:var(--muted);font-size:13px}
.invd{width:52px;border-radius:10px;overflow:hidden;text-align:center;box-shadow:var(--shadow);background:var(--surface)}
.invd small{display:block;background:var(--accent);color:var(--accent-ink)!important;font-size:11px!important;font-weight:700;padding:2px 0;text-transform:uppercase}
.invd b{display:block;font-size:22px;font-weight:800;padding:2px 0 4px}
.invf{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rec{display:block;margin-top:4px;font-size:11.5px;font-weight:700;color:var(--ok)}
.rec.soft{color:var(--muted);font-weight:600}
.recp{border:1.5px solid var(--ok);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--ok-soft)}
.recp>b{font-size:14px;color:var(--ok)}
.reco{display:grid;grid-template-columns:34px 1fr auto auto;gap:10px;align-items:center;background:var(--surface);border-radius:12px;padding:8px 10px}
.pvb{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--ok-soft);border:1.5px solid var(--ok);border-radius:14px;padding:10px 14px;font-size:14px}
.pvb b{color:var(--ok)}
.pvbtn{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.dayv{margin-top:10px;background:var(--surface);border-radius:14px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.dv-h{display:flex;flex-direction:column;gap:2px}
.tlbar{position:relative;padding-top:18px}
.tlh{position:relative;height:16px;margin-top:-18px}
.tlh span{position:absolute;transform:translateX(-50%);font-size:11px;color:var(--muted)}
.tlr{position:relative;height:38px;background:repeating-linear-gradient(90deg,var(--surface2),var(--surface2) calc(10% - 1px),var(--line) calc(10% - 1px),var(--line) 10%);border-radius:8px}
.tlr i{position:absolute;top:4px;bottom:4px;border-radius:6px;font-style:normal;font-size:11px;font-weight:700;padding:0 6px;display:flex;align-items:center;overflow:hidden;white-space:nowrap;background:var(--surface);box-shadow:var(--shadow);border-left:3px solid var(--muted)}
.tlr i.Wartung{border-left-color:var(--ok)}.tlr i.Störung{border-left-color:var(--crit)}.tlr i.Reparatur,.tlr i.Folgeauftrag{border-left-color:var(--warn)}.tlr i.Umbau{border-left-color:var(--t4)}.tlr i.Sonstiges{border-left-color:var(--t3)}.tlr i.Inbetriebnahme{border-left-color:var(--t2)}
.tlr i.gh{background:var(--ok-soft);border:2px dashed var(--ok);color:var(--ok);z-index:2}
.tlr i.blk{background:var(--warn-soft);color:var(--warn);border-left-color:var(--warn);box-shadow:none}
.dvl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.dvl li{display:grid;grid-template-columns:96px 1fr;gap:10px;font-size:14px;padding:4px 0}
.dvl li time{font-weight:700}
.dvl li.leg{color:var(--muted);font-size:12px;padding:0 0 0 106px;display:block;border-left:2px dotted var(--line);margin-left:40px}
.dvl li.base{color:var(--muted)}
.dvl li.gh{background:var(--ok-soft);border-radius:10px;padding:6px 8px;margin:0 -8px}
.cell.pv{box-shadow:0 0 0 2px var(--ok) inset,var(--shadow)}
.card.ghost{border:2px dashed var(--ok);background:var(--ok-soft);box-shadow:none;cursor:default}
.f3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.skills{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.sk{display:flex;align-items:center;gap:8px;background:var(--surface2);border-radius:10px;padding:8px 12px;font-size:14px;cursor:pointer}
.sk input{width:17px;height:17px;accent-color:var(--accent)}
.fsw{border:2px solid transparent;width:44px;height:44px;border-radius:50%;font-weight:800;font-size:12px}
.fsw.on{border-color:var(--fg)}
.sav{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px}
@media (max-width:900px){.f3{grid-template-columns:1fr}}
.stabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:0}
.stabs button{border:0;background:none;padding:9px 14px;font-weight:600;font-size:14px;color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-1px}
.stabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.sw small{display:block;color:var(--muted);font-size:12px;font-weight:500}

function load(techId,date){return dayOrders(techId,date).reduce((s,o)=>s+o.dauer,0)}
function nextSlot(techId,date,dauer){let t=hm("07:30");for(const o of dayOrders(techId,date)){const s=hm(o.time),e=s+o.dauer*60+30;if(t+dauer*60<=s)return tt(t);t=Math.max(t,e)}return tt(t)}
function lastDone(a){return S.orders.filter(o=>o.nv===a.nv&&o.art==="Wartung"&&o.status==="erledigt"&&o.date).reduce((m,o)=>o.date>m?o.date:m,a.letzte)}

function openFor(nv,art){return S.orders.some(o=>o.nv===nv&&o.art===art&&o.status!=="erledigt")}

}

/* ---------- Empfehlung: wer kann den Auftrag am besten übernehmen? ---------- */
function recommend(o){
 const a=anl(o.nv),need=needs(a),dring=o.prio==="hoch"||o.art==="Störung",now=new Date(),nowMin=now.getHours()*60+now.getMinutes();
 const days=[TODAY,wd(TODAY,1),wd(TODAY,2)].filter(d=>D(d).getDay()%6),out=[];
 for(const t of MONT()){
  const fehlt=need.filter(n=>!t.skills.includes(n));
  if(fehlt.length){out.push({t,aus:`fehlt Qualifikation: ${fehlt.join(", ")}`});continue}
  let best=null;
  for(const d of days){
   if(absOn(t.id,d,true).some(x=>x.art==="Urlaub"))continue;
   let slot=hm(nextSlot(t.id,d,o.dauer));if(d===TODAY)slot=Math.max(slot,Math.ceil((nowMin+45)/30)*30);
   const block=absOn(t.id,d,false).find(x=>x.art==="Block"&&x.zeit);if(block){const[bv,bb]=block.zeit.split("–").map(hm);if(slot<bb&&slot+o.dauer*60>bv)slot=bb}
   if(slot+o.dauer*60>hm("17:00"))continue;
   const prev=dayOrders(t.id,d).filter(x=>hm(x.time)<=slot).pop(),von=prev?anl(prev.nv).ort:t.base,dist=km(von,a.ort);
   const wait=Math.round((D(d)-D(TODAY))/864e5)*24*60+slot-(d===TODAY?nowMin:0);
   const score=(dring?wait/30:wait/240)+dist/4+(a.betreuer===t.id?-6:0)+(load(t.id,d)+o.dauer>8?8:0);
   if(!best||score<best.score)best={t,d,time:tt(slot),dist,von,score,frei:Math.max(0,8-load(t.id,d))};
  }
  out.push(best||{t,aus:"in den nächsten Tagen keine freie Zeit"});
 }
 return out.sort((x,y)=>(x.score??1e9)-(y.score??1e9));
}

/* ---------- Druckmodus für die PDF-Ablage (Server, druck.ts) ---------- */
async function drucken(art,id){
 const fertig=f=>{window.NF_DRUCK={fertig:true,fehler:f||""}};
 try{
  document.body.innerHTML="";document.body.classList.add("druckmodus");
  const L=document.createElement("div");L.id=art==="rechnung"?"relayer":"a4layer";document.body.appendChild(L);
  let html="";
  if(art==="bericht"){const b=S.ber.find(x=>x.sb===id);if(!b)return fertig("Bericht "+id+" nicht gefunden");await vollLaden(b.sb);html=a4Doc(b)}
  else if(art==="rechnung"){const r=S.rech.find(x=>x.re===id);if(!r)return fertig("Rechnung "+id+" nicht gefunden");if(r.sb)await vollLaden(r.sb);html=reDoc(r)+(r.sb?`<div class="annexp">${a4Doc(berFor(r))}</div>`:"")}
  else if(art==="kunde"){if(!NF.get("kunden",id))return fertig("Kunde "+id+" nicht gefunden");html=kdDoc(id)}
  else return fertig("Unbekannte Druckart");
  L.innerHTML=`<div class="a4v"><div class="a4s"><div class="a4p">${html}</div></div></div>`;
  await Promise.all([...L.querySelectorAll("img")].map(im=>im.complete?0:new Promise(r=>{im.onload=im.onerror=r})));
  if(document.fonts&&document.fonts.ready)await document.fonts.ready;
  fertig();
 }catch(e){fertig(e.message||String(e))}}
